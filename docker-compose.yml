# BioSDK v4.3 — Full Stack
# BioCompute OS + Dashboard + BioReservoir
#
# Start:
#   docker compose up -d
#
# Stop:
#   docker compose down
#
# Dashboard: http://localhost:8420
# OS health:  http://localhost:8420/api/v1/health

services:
  # ── BioSDK Core (OS + BioReservoir + Dashboard) ────────────────────
  biosdk:
    build: .
    image: biosdk:v4.3
    container_name: biosdk-core
    restart: unless-stopped
    ports:
      - "8420:8420"
    volumes:
      # Mount data directory for real spike data access
      - ./data:/app/data:ro
      # Mount outputs for evidence bundles, sweep results, OS state
      - ./outputs:/app/outputs
      # Mount configs for production overrides
      - ./configs:/app/configs:ro
    environment:
      - BIOSDK_SIGNING_KEY=${BIOSDK_SIGNING_KEY:-biosdk-docker-v4.3}
      - BIOSDK_DATA_DIR=/app/data
      - BIOSDK_OUTPUT_DIR=/app/outputs
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import biosdk; print(f'v{biosdk.__version__}')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G

