[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biosdk"
version = "0.1.4"
description = "BioSDK — Unified Neural Data Library. One open() for MEA, EEG, ecephys, Sleep, RNG. Evidence bundles included."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE", "COMMERCIAL_LICENSE.md"]
authors = [
    {name = "Vladislav Dobrovolskii", email = "vladimoryachok@gmail.com"},
]
keywords = [
    "neuroscience",
    "neural-data",
    "mea",
    "eeg",
    "ecephys",
    "wetware",
    "biological-neural-networks",
    "vendor-neutral",
    "standard",
    "nsi",
    "neural-signal-interface",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "h5py>=3.8",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.100", "uvicorn>=0.23"]
mne = ["mne>=1.0"]
nwb = ["pynwb>=2.0"]
dev = ["pytest>=7.0", "build>=1.0", "twine>=4.0"]
all = ["biosdk[dashboard,mne,nwb,dev]"]

[project.urls]
Homepage = "https://github.com/Vladrus39/BioSDK"
Documentation = "https://github.com/Vladrus39/BioSDK/blob/master/README.md"
Repository = "https://github.com/Vladrus39/BioSDK"
Issues = "https://github.com/Vladrus39/BioSDK/issues"

[tool.setuptools.packages.find]
include = ["biogpu*", "biosdk*"]
exclude = ["tests*", "legacy*", "outputs*", "evidence*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests/current"]
pythonpath = ["."]
addopts = "-q"

[project.scripts]
biosdk = "biosdk.cli:main"
biosdk-dashboard = "biogpu.dashboard.server_v71:main"
